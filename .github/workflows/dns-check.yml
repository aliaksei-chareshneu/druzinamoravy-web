name: Public DNS and HTTPS check
on:
  push:
    branches:
      - diagnostics/dns-20261127
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query independent public resolvers and test HTTPS
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          expected={"185.199.108.153","185.199.109.153","185.199.110.153","185.199.111.153"}
          domain="druzinamoravy.cz"
          print("UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
          passed=True
          for provider,base in [("Google","https://dns.google/resolve"),("Cloudflare","https://cloudflare-dns.com/dns-query")]:
              for name,kind,rrtype in [(domain,"A",1),("www."+domain,"CNAME",5)]:
                  try:
                      u=base+"?"+urllib.parse.urlencode({"name":name,"type":kind})
                      req=urllib.request.Request(u,headers={"Accept":"application/dns-json"})
                      with urllib.request.urlopen(req,timeout=10) as r: data=json.load(r)
                      values={v["data"].lower().rstrip(".") for v in data.get("Answer",[]) if v["type"]==rrtype}
                      wanted=expected if kind=="A" else {"aliaksei-chareshneu.github.io"}
                      ok=data.get("Status")==0 and values==wanted
                      passed=passed and ok
                      print(provider,name,kind,"status",data.get("Status"),"answers",sorted(values),"PASS" if ok else "NOT PASS",flush=True)
                  except Exception as e:
                      passed=False
                      print(provider,name,kind,"ERROR",str(e),flush=True)
          print("PUBLIC DNS:", "PASS" if passed else "NOT PASS")
          for u in ["http://"+domain+"/","https://"+domain+"/","https://www."+domain+"/"]:
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0 DNS site verification"})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      sample=r.read(100000).decode("utf-8","replace")
                      print("HTTP",u,r.status,"final",r.geturl(),"expected organization",("29876150" in sample and "Družina Moravy" in sample),flush=True)
              except Exception as e: print("HTTP",u,"ERROR",str(e),flush=True)
          PY
